name: macOS installer
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'pilot requires Open Anyway; notarized requires Apple Developer credentials'
        type: choice
        default: pilot
        options: [pilot, notarized]
  push:
    branches: [codex/macos-installer]
    paths: ['mac/**', '.github/workflows/macos-installer.yml', 'adobe/package-lock.json']
permissions:
  contents: read
concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DIT_MAC_DISTRIBUTION: ${{ github.event.inputs.distribution || 'pilot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build-only media tools
        run: brew install ffmpeg sevenzip
      - name: Configure Apple notarization credentials
        if: env.DIT_MAC_DISTRIBUTION == 'notarized'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          DIT_MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD DIT_MAC_SIGN_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then echo "Missing required Apple credential: $key" >&2; exit 1; fi
          done
          xcrun notarytool store-credentials DIT --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          echo 'APPLE_KEYCHAIN_PROFILE=DIT' >> "$GITHUB_ENV"
      - name: Build and test isolated macOS app
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          DIT_MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: bash mac/build.sh '${{ matrix.arch }}'
      - name: Upload installers and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIT-macOS-${{ matrix.arch }}
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.zip
            artifacts/macos/*.sha256
            artifacts/macos/test-*.json
            artifacts/macos/preview-*.png
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.arch }}
          path: |
            mac/**/TestResults/*.trx
            mac/app/npm-debug.log
